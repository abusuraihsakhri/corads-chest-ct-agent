[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corads-chest-ct-engine"
version = "2.0.0"
description = "CO-RADS Sentinel: Pulmonary Viral Pneumonia & Ground-Glass Severity Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
corads-chest-ct-engine = "corads_chest_ct_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/corads-chest-ct-engine"
Repository = "https://github.com/abusuraihsakhri/corads-chest-ct-engine.git"
