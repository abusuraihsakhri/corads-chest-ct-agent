[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "corads-chest-ct-agent"
version = "2.1.0"
description = "Rule-based CO-RADS chest CT assessment and five-lobe CT severity scoring helpers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
]
test = [
    "pydantic>=2.7,<3",
    "pytest>=8,<10",
]
legacy = ["pydantic>=2.7,<3"]

[project.scripts]
corads-chest-ct-agent = "corads_chest_ct_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/corads-chest-ct-agent"
Repository = "https://github.com/abusuraihsakhri/corads-chest-ct-agent.git"

[tool.setuptools.packages.find]
include = ["corads_chest_ct_agent*", "agents*"]
exclude = ["tests*", "web*"]
