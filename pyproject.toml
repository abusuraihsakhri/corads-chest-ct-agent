[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "corads-chest-ct-agent"
version = "2.1.0"
description = "Rule-based CO-RADS chest CT assessment and five-lobe CT severity scoring helpers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.141.1,<1",
    "pydantic>=2.13.5,<3",
    "uvicorn>=0.39,<1",
]
test = [
    "pydantic>=2.13.5,<3",
    "pytest>=9.0.3,<10",
]
legacy = ["pydantic>=2.13.5,<3"]

[project.scripts]
corads-chest-ct-agent = "corads_chest_ct_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/corads-chest-ct-agent"
Repository = "https://github.com/abusuraihsakhri/corads-chest-ct-agent.git"

[tool.setuptools.packages.find]
include = ["corads_chest_ct_agent*", "agents*"]
exclude = ["tests*", "web*"]
