name: Release

on:
  push:
    branches: [master]
    paths:
      - "pyproject.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read project version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no action needed."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Corrected CO-RADS categorization logic; consolidated CLI and API behavior; hardened audit integrity verification; repaired packaging and container startup; added dependency auditing, cross-version CI, and the static GitHub Pages application."
